name: Apply public client patch

on:
  workflow_dispatch:
  push:
    paths:
      - patch_public_client.py
      - .github/workflows/apply_public_client_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run patch
        run: python patch_public_client.py

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply public client view patch"
            git push
          fi
